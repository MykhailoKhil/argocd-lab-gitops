# One store for the whole cluster, backed by Vault KV v2 at path "secret/".
# Vault runs in this cluster, so the in-cluster service address is used.
# Auth: a read-only Vault token kept in Secret external-secrets/vault-token.
# That token is the one secret created by hand ("secret zero"); see docs/vault.md.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: vault-token
          namespace: external-secrets
          key: token
