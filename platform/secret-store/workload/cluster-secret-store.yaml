# One store for the whole cluster, backed by Vault KV v2 at path "secret/".
# Vault runs in mgmt; reached through its NodePort over the shared docker network.
# Auth: a read-only Vault token kept in Secret external-secrets/vault-token.
# That token is the one secret created by hand ("secret zero"); see docs/vault.md.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://k3d-mgmt-server-0:30820
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: vault-token
          namespace: external-secrets
          key: token
