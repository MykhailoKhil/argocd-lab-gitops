# T24: the same Telegram bot token for Argo Rollouts notifications (rollout aborted, completed...).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argo-rollouts-notification-secret
  namespace: argo-rollouts
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: argo-rollouts-notification-secret
    creationPolicy: Owner
  data:
    - secretKey: telegram-token
      remoteRef:
        key: notifications/telegram
        property: token
