# Grafana admin credentials from Vault (secret/grafana/admin: admin-user, admin-password).
# kube-prometheus-stack reads them via grafana.admin.existingSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: grafana-admin
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: grafana/admin
