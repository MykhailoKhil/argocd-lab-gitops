# T25: Prometheus runs on the WORKLOAD cluster, Argo CD on mgmt. These NodePort Services
# expose Argo CD's metrics ports on the mgmt node, so Prometheus scrapes them over the shared
# docker network at k3d-mgmt-server-0:<nodePort> (see kube-prometheus-stack additionalScrapeConfigs).
apiVersion: v1
kind: Service
metadata:
  name: argocd-metrics-controller
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: argocd-application-controller
  ports:
    - name: metrics
      port: 8082
      targetPort: 8082
      nodePort: 30882
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-metrics-server
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
    - name: metrics
      port: 8083
      targetPort: 8083
      nodePort: 30883
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-metrics-repo-server
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: argocd-repo-server
  ports:
    - name: metrics
      port: 8084
      targetPort: 8084
      nodePort: 30884
