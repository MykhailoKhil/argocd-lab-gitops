# cert-manager on the WORKLOAD cluster, so Ingresses there (Grafana) get certificates too.
# Same chart and values as cert-manager.yaml; only the name and destination differ.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-workload
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: platform
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.2
    helm:
      releaseName: cert-manager
      valuesObject:
        crds:
          enabled: true
          keep: true        # don't delete Certificates cluster-wide if the app is removed
        prometheus:
          enabled: true     # scraped later by kube-prometheus-stack (T08)
  destination:
    name: workload
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
