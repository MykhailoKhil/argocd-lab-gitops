# The same self-signed CA chain (platform/cert-manager-issuers) applied to the WORKLOAD cluster.
# It generates its OWN root CA there: two clusters, two roots. Trust both on your Mac.
# (One shared CA would mean copying the CA key between clusters: that needs a secrets tool, see T09.)
#
# Note: sync waves in the root app do NOT wait for the cert-manager app to become healthy
# (Argo CD does not assess child Application health by default). So on a fresh cluster this
# app may try to sync before the CRDs exist. SkipDryRunOnMissingResource + retry handles it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-issuers-workload
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: platform
  source:
    repoURL: https://github.com/MykhailoKhil/argocd-lab-gitops.git
    targetRevision: main
    path: platform/cert-manager-issuers
  destination:
    name: workload
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
