# T08: Loki (logs) on the workload cluster, single-replica monolithic mode, local filesystem storage.
# Chart: grafana-community/loki. The old grafana/loki chart is now maintained for GEL customers only.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: platform
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: 18.13.5
    helm:
      releaseName: loki
      valuesObject:
        fullnameOverride: loki
        deploymentMode: Monolithic
        loki:
          auth_enabled: false          # single tenant, no X-Scope-OrgID header needed
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          limits_config:
            retention_period: 72h
            allow_structured_metadata: true
            volume_enabled: true
          compactor:
            retention_enabled: true
            delete_request_store: filesystem
        singleBinary:
          replicas: 1
          persistence:
            size: 5Gi
        # all distributed / simple-scalable components off
        backend: { replicas: 0 }
        read: { replicas: 0 }
        write: { replicas: 0 }
        ingester: { replicas: 0 }
        querier: { replicas: 0 }
        queryFrontend: { replicas: 0 }
        queryScheduler: { replicas: 0 }
        distributor: { replicas: 0 }
        compactor: { replicas: 0 }
        indexGateway: { replicas: 0 }
        bloomPlanner: { replicas: 0 }
        bloomBuilder: { replicas: 0 }
        bloomGateway: { replicas: 0 }
        # memcached caches request GBs of RAM by default: too much for a laptop
        chunksCache: { enabled: false }
        resultsCache: { enabled: false }
        lokiCanary: { enabled: false }
        test: { enabled: false }
        minio: { enabled: false }
  destination:
    name: workload
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
