# T09: ClusterSecretStore + ExternalSecrets for workload (platform/secret-store/workload).
# Uses CRDs from the external-secrets app, hence SkipDryRunOnMissingResource + retry.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-store-workload
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: platform
  source:
    repoURL: https://github.com/MykhailoKhil/argocd-lab-gitops.git
    targetRevision: main
    path: platform/secret-store/workload
  destination:
    name: workload
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
