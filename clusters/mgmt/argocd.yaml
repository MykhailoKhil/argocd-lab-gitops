# Self-managed Argo CD: the chart comes from the Argo Helm repo,
# the values come from this git repo (multi-source Application).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: platform
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.7.1
      helm:
        releaseName: argocd
        valueFiles:
          - $values/bootstrap/argocd/values.yaml
    - repoURL: https://github.com/MykhailoKhil/argocd-lab-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false      # never let Argo CD prune itself by accident
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
