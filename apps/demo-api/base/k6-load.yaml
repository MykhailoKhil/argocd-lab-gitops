# T16: k6 as a permanent load generator in each environment (lab only: in a real
# company this would be real users or a synthetic-monitoring service).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k6-load
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: k6-load
  template:
    metadata:
      labels:
        app.kubernetes.io/component: k6-load
    spec:
      containers:
        - name: k6
          image: grafana/k6:2.3.0
          args: ["run", "--quiet", "/scripts/load.js"]
          env:
            - name: HOST
              value: PATCH-ME.localtest.me   # patched per overlay
            - name: RATE
              value: "10"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
      volumes:
        - name: scripts
          configMap:
            name: demo-api-k6
