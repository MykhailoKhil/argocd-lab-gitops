# Becomes an Argo Rollout with canary steps in T14.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
spec:
  replicas: 1
  selector:
    matchLabels: {}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: demo-api
          image: ghcr.io/mykhailokhil/demo-api:latest  # overridden per env via kustomize images
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: FAULT_LATENCY_MS   # T17: set > 0 to make a "bad" release
              value: "0"
            - name: FAULT_ERROR_RATE   # T17: 0.0–1.0 share of requests that return 500
              value: "0"
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
