# PodMonitor instead of ServiceMonitor: with two Services over the same pods a ServiceMonitor
# would scrape every pod twice. podTargetLabels copies the ReplicaSet hash onto every series,
# so T15 can compare canary vs stable in PromQL.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: demo-api
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-api
  podTargetLabels:
    - rollouts-pod-template-hash
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s
