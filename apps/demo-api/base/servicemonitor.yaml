# T08: tells Prometheus to scrape demo-api's /metrics every 15s.
# SkipDryRunOnMissingResource: on a fresh cluster this can sync before the
# Prometheus Operator CRDs exist (they come from the kube-prometheus-stack app).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: demo-api
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-api   # kustomize labels don't reach ServiceMonitor selectors
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
