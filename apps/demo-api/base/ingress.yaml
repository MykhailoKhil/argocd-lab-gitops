# HTTPS entrypoint per environment. The host is a placeholder: every overlay patches it.
# Traefik (built into k3s) serves it; cert-manager on the workload cluster issues the cert.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-api
  annotations:
    cert-manager.io/cluster-issuer: lab-ca
spec:
  ingressClassName: traefik
  rules:
    - host: PATCH-ME.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-api
                port:
                  name: http
  tls:
    - secretName: demo-api-tls
      hosts:
        - PATCH-ME.localtest.me
