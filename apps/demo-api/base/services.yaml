# Two Services over the same pods. Argo Rollouts adds a rollouts-pod-template-hash selector
# to each, so "stable" only reaches the old version and "canary" only the new one.
apiVersion: v1
kind: Service
metadata:
  name: demo-api-stable
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api-canary
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
