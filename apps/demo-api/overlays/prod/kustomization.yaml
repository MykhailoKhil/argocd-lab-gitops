apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - pdb.yaml   # prod only: keep 2 of 3 pods during node drains / upgrades
images:
  - name: ghcr.io/mykhailokhil/demo-api
    newTag: sha-68dd077  # changed only by the promote workflow (.github/workflows/promote.yaml)
patches:
  # kustomize's "replicas:" field doesn't support the Rollout kind, so patch it
  - target:
      kind: Rollout
      name: demo-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 100m, memory: 64Mi }
          limits: { memory: 128Mi }
  - target:
      kind: IngressRoute
      name: demo-api
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`demo.localtest.me`)
  - target:
      kind: Certificate
      name: demo-api
    patch: |-
      - op: replace
        path: /spec/dnsNames/0
        value: demo.localtest.me
  - target:
      kind: Deployment
      name: k6-load
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: demo.localtest.me
